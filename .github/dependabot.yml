version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "com.bandwidth.sdk:bandwidth-sdk"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "com.bandwidth.sdk:bandwidth-sdk"
